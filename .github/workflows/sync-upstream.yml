name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      SYNC_BRANCH: sync/upstream
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fast-forward main to upstream/main
        id: sync
        run: |
          git remote add upstream https://github.com/alexfayers/mcp-memory.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "Already up to date."
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor origin/main upstream/main; then
            git push origin upstream/main:refs/heads/main
            echo "Fast-forwarded main to upstream/main."
            echo "status=fast-forwarded" >> "$GITHUB_OUTPUT"
          else
            git push origin upstream/main:refs/heads/"$SYNC_BRANCH"
            echo "main has diverged from upstream/main."
            echo "status=diverged" >> "$GITHUB_OUTPUT"
          fi

      - name: Open sync PR for diverged main
        if: steps.sync.outputs.status == 'diverged'
        run: |
          if [ -n "$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[]')" ]; then
            echo "Sync PR already open."
            exit 0
          fi

          gh label create sync --color 0E8A16 --description "Automated upstream sync" --force
          gh pr create \
            --head "$SYNC_BRANCH" \
            --base main \
            --title "Sync upstream" \
            --body "main has commits not in [alexfayers/mcp-memory](https://github.com/alexfayers/mcp-memory), so it can't be fast-forwarded. Rebase the fork's commits onto upstream/main locally, or merge this PR with a merge commit." \
            --label sync
